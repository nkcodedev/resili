name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "packages/**"
      - "typedoc.json"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  typedoc:
    name: TypeDoc
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API docs
        run: pnpm run docs
