name: Bug report
description: Report a reproducible problem in Resili
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail for maintainers to reproduce the issue.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, package manager, runtime, and any relevant tooling.
      placeholder: macOS 15, pnpm 10, TypeScript 5.9
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: v20.19.0
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      description: Include the affected Resili package and version or commit SHA.
      placeholder: "@resili/core@0.0.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a minimal reproduction or exact commands.
      placeholder: |
        1. Install ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant stack traces, terminal output, or diagnostics.
      render: shell
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add links, screenshots, suspected causes, or workarounds.
